name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static artifact
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID || secrets.GOOGLE_OAUTH_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css app.js db.js backup.js drive.js storage.js sw.js config.js manifest.webmanifest icon.svg _site/
          touch _site/.nojekyll

          # Package the Chromium extension so the deployed app can offer a direct download.
          (
            cd extension
            zip -qr ../_site/readdeck-extension.zip .
          )

          if [ -n "${GOOGLE_OAUTH_CLIENT_ID:-}" ]; then
            node <<'NODE'
          const fs = require('fs');
          const config = { googleOAuthClientId: process.env.GOOGLE_OAUTH_CLIENT_ID };
          fs.writeFileSync('_site/config.js', `window.READDECK_CONFIG = ${JSON.stringify(config)};\n`);
          NODE
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
